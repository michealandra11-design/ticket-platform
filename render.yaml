services:
  - type: web
    name: ticket-platform-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./ticketPlatform.sqlite3
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: ticket-platform-frontend
    runtime: static
    buildCommand: cd Frontend && npm install && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback so client-side routes like /events/5 and /admin don't
      # 404 on direct navigation or refresh.
      - type: rewrite
        source: /*
        destination: /index.html
